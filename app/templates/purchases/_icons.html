{# Reuse existing inline Lucide icons, adding only missing glyphs. #}
{% import "settings/_macros.html" as shared %}
{% macro icon(name) -%}
{% if name in ['eye','dollar','filter','x','menu','file','download'] %}<svg class="st-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'eye' %}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'dollar' %}<circle cx="12" cy="12" r="10"/><path d="M12 6v12M16 8h-6a2 2 0 0 0 0 4h4a2 2 0 0 1 0 4H8"/>
{% elif name == 'filter' %}<path d="M22 3H2l8 9v7l4 2v-9l8-9Z"/>
{% elif name == 'x' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'file' %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>
{% elif name == 'download' %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
{% else %}<path d="M3 6h18M3 12h18M3 18h18"/>{% endif %}</svg>
{% else %}{{ shared.icon(name) }}{% endif %}
{%- endmacro %}
