<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                       style="background:#ffffff;border-radius:8px;padding:32px;max-width:560px;">
                    <tr>
                        <td style="text-align:center;padding-bottom:16px;">
                            <h1 style="margin:0;font-size:20px;color:#1a1a1a;">{{ app_name }}</h1>
                            <p style="margin:4px 0 0;font-size:13px;color:#6c757d;">{{ event_label }}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:15px;color:#333333;line-height:1.6;">
                            <h2 style="margin:0 0 12px;font-size:17px;color:#1a1a1a;">{{ notification.title }}</h2>
                            <p style="margin:0 0 12px;">{{ notification.message }}</p>
                            <p style="margin:0;color:#6c757d;font-size:13px;">
                                Generado el {{ notification.created_at.strftime('%d/%m/%Y %H:%M') }} (UTC).
                                Puede ajustar qué eventos recibe en Configuración &gt; Notificaciones.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
